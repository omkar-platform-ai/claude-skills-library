name: Publish Skills Index

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**/metadata.yaml'
      - 'tools/generate_index.py'
      - '.github/workflows/publish-index.yml'
  workflow_dispatch:

jobs:
  regenerate-index:
    name: Regenerate SKILLS_INDEX.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r tools/requirements.txt
      - name: Regenerate index
        run: python tools/generate_index.py
      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(index): regenerate SKILLS_INDEX.md'
          file_pattern: SKILLS_INDEX.md
