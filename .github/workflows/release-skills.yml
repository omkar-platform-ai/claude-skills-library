name: Release Skills

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**/metadata.yaml'
  workflow_dispatch:
    inputs:
      skill_path:
        description: 'Single skill directory to release (e.g. skills/contributed/foo). Leave blank if using release_all.'
        required: false
      release_all:
        description: 'Release every skill at its current metadata.yaml version. Skips any skill that already has a tag. Use this once for the initial bootstrap.'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Detect bumps and publish per-skill releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Release bumped skills
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.release_all }}" = "true" ]; then
              python tools/release_skills.py --release-all
            elif [ -n "${{ inputs.skill_path }}" ]; then
              python tools/release_skills.py --skill-path "${{ inputs.skill_path }}"
            else
              echo "::error::Provide skill_path or set release_all=true"
              exit 1
            fi
          else
            python tools/release_skills.py --before-sha "${{ github.event.before }}"
          fi
