name: Validate & Test Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - '.github/workflows/validate-pr.yml'
  push:
    branches:
      - main
    paths:
      - 'skills/**'

jobs:
  validate:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema markdown
      
      - name: Run skill validator
        run: |
          python tools/skill-validator.py skills/
        continue-on-error: false

  evals:
    name: Run Skill Evaluations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install anthropic pyyaml jsonschema
      
      - name: Run evaluations
        run: |
          python tools/eval-runner.py skills/
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: eval-results
          path: .eval-results/

  lint:
    name: Lint Markdown & YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Lint markdown
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: skills/
      
      - name: Lint YAML
        run: |
          pip install yamllint
          yamllint -c .yamllint skills/

  package:
    name: Package Modified Skills
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Package skills
        run: |
          python tools/skill-packager.py skills/ --output ./dist/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: packaged-skills
          path: dist/
