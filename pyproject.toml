[project]
name = "claude-skills-library"
version = "0.1.0"
description = "Production-grade skills library for Claude AI"
authors = [{name = "Anthropic", email = "support@anthropic.com"}]
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "anthropic>=0.20.0",
    "markdown>=3.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
    "yamllint>=1.28.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
